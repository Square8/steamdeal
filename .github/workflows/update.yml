name: 가격 수집 및 사이트 배포

on:
  # 코드를 push 하면 바로 다시 빌드·배포한다.
  # 이게 없으면 코드를 고쳐도 다음 예약 실행(하루 2번)까지 사이트가 안 바뀌고,
  # 매번 Actions 탭에서 손으로 Run workflow 를 눌러야 한다.
  # data/ 는 이 워크플로우 자신이 커밋하는 곳이라 제외한다(자기 자신 재실행 방지).
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'README.md'
  schedule:
    # GitHub Actions cron 은 UTC 기준. 한국시간 08:40 / 20:40 에 맞춤.
    - cron: '40 23 * * *'   # KST 08:40
    - cron: '40 11 * * *'   # KST 20:40
  workflow_dispatch:        # 수동 실행 버튼

# Pages 배포에 필요한 권한 + DB 커밋 권한
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: steamradar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install --quiet requests

      # build 보다 먼저 실행해야 base_url(사이트 절대주소)을 얻을 수 있다.
      - name: Pages 설정
        id: pages
        uses: actions/configure-pages@v5

      # push 로 온 실행은 수집을 건너뛰고 사이트만 다시 만든다(약 10초).
      # 코드를 고쳐 올릴 때마다 스팀 API 를 800번 부르며 20분을 쓸 이유가 없다.
      # 예약 실행과 수동 실행(Run workflow)에서는 정상적으로 수집한다.
      - name: 가격 수집
        if: github.event_name != 'push'
        run: python collect.py

      - name: 사이트 생성
        # SITE_URL 은 사이트맵·canonical·og:url 의 절대 URL 에 쓰인다.
        # 이게 없으면 검색엔진이 정본 주소를 알 수 없다.
        run: python build.py
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          # 검색엔진 소유 확인 코드. 저장소 Settings > Secrets and variables >
          # Actions > Variables 에 같은 이름으로 넣으면 자동으로 태그가 붙는다.
          # 안 넣으면 태그가 안 나가고 나머지는 그대로 동작한다.
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          NAVER_SITE_VERIFICATION: ${{ vars.NAVER_SITE_VERIFICATION }}

      # 가격 이력(SQLite)은 저장소에 커밋해서 다음 실행까지 남긴다.
      # 이게 없으면 '역대 최저가'를 계산할 이력이 매번 사라진다.
      - name: 가격 이력 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/steam.sqlite3
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "가격 이력 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
